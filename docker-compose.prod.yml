version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: mvura-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - mvura-network

  postgres:
    image: postgres:16-alpine
    container_name: mvura-postgres
    environment:
      POSTGRES_DB: mvura
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d mvura"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mvura-network

  redis:
    image: redis:7-alpine
    container_name: mvura-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mvura-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: mvura-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mvura
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_ENCRYPTION_AES_KEY: ${AES_ENCRYPTION_KEY}
      APP_AI_HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      APP_USSD_API_KEY: ${USSD_API_KEY}
      APP_USSD_USERNAME: ${USSD_USERNAME}
      APP_USSD_SHORT_CODE: ${USSD_SHORT_CODE}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mvura-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: mvura-frontend
    environment:
      VITE_API_URL: https://api.mvura.rw
    networks:
      - mvura-network

  backup:
    image: postgres:16-alpine
    container_name: mvura-backup
    volumes:
      - ./backup:/backup
    environment:
      POSTGRES_DB: mvura
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    entrypoint: |
      sh -c "
      while true; do
        pg_dump -h postgres -U ${DB_USER} mvura | gzip > /backup/mvura_\$(date +\%Y\%m\%d_\%H\%M\%S).sql.gz
        find /backup -name '*.sql.gz' -mtime +30 -delete
        sleep 86400
      done
      "
    networks:
      - mvura-network

volumes:
  postgres_data:
  redis_data:

networks:
  mvura-network:
    driver: bridge